<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Pula Coelho</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pula Coelho</h1>
  <div id="score">Pontos: 0</div>
  <canvas id="canvas" width="800" height="400"></canvas>
  <div id="controls">
    <button id="powerup-btn">POWER UP</button>
  </div>
  <div id="gameover">
    <div id="gameover-box">
      <h2>Você morreu!</h2>
      <button id="restart-btn">Jogar de novo</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
